<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <!-- Grid: header 104px; boundary x 336..1168, y 156..748; three 228px columns at x 362/638/914 with 48px gutters; card rows y 222 and 410, height 148, band 42px. Flow arrows sit on the row centres 296 and 484. -->
  <title id="title">Application platform architecture</title>
  <desc id="desc">Public clients and a source repository sit outside the platform boundary. Inside an OpenStack project: an external DNS/HTTPS service forwards the original host to ingress; a control plane runs the scheduler, health-gated rollout and bounded failed-candidate cleanup, and secret and deployment state; single-use builder VMs publish image digests; stateless project workers run one application each and are deployed by digest with bounded failed-candidate cleanup; managed services provide SQL, document, object storage, and an image registry; and encrypted, application-aware backups are verified by restore. Continuous integration publishes the five NixOS role images into the project as commit-addressed candidates; operators select a tested image by its exact provider UUID, with no rename or manual promotion step. No deployment identifiers, addresses, capacities, or software versions are shown.</desc>
