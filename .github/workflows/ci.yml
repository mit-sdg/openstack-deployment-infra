name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Build and publish deployment images from the selected commit
        type: boolean
        default: false
      live_acceptance:
        description: Run the protected disposable live acceptance gate
        type: boolean
        default: false
      development_publish:
        description: Build, smoke-test, and publish all roles with unsigned development evidence
        type: boolean
        default: false
  schedule:
    - cron: "17 4 * * 6"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.2"
          enable-cache: true

      - name: Install locked Python environment
        run: uv sync --frozen

      - name: Check Python formatting, lint, and types
        run: |
          uv lock --check
          uv run ruff format --check openstack_platform deploy/releases infra tests
          uv run ruff check openstack_platform deploy/releases infra tests
          uv run mypy
          uv run vulture openstack_platform deploy infra tests --min-confidence 80 --sort-by-size

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Validate JSON and SVG
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import xml.etree.ElementTree as ET

          for path in Path("config").rglob("*.example.json"):
              json.loads(path.read_text())
              print(f"valid JSON: {path}")
          ET.parse("docs/architecture-overview.svg")
          print("valid SVG: docs/architecture-overview.svg")
          PY
          uv run python infra/lib/platform_contract.py
          PLATFORM_CONFIG=config/platform.example.json \
            uv run python infra/lib/platform_config.py validate

      - name: Generate and verify development supply-chain evidence
        run: |
          uv run python -m openstack_platform.release_manifest generate \
            --repository . --commit "$GITHUB_SHA" --output release-evidence \
            --unsigned-development
          uv run python -m openstack_platform.release_manifest verify \
            --repository . --commit "$GITHUB_SHA" \
            --manifest release-evidence/release-manifest.json \
            --allow-unsigned-development

      - name: Publish development SBOM and provenance evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: development-release-evidence-${{ github.sha }}
          path: release-evidence
          if-no-files-found: error

      - name: Compile Python
        run: uv run python -m compileall -q openstack_platform deploy infra tests

      - name: Smoke integrated entrypoints
        run: |
          if [[ -f openstack_platform/operator.py && -f openstack_platform/helper/actions-v1.txt ]]; then
            uv run python deploy/releases/release_smoke.py \
              helper --source "$PWD"
            uv run openstack-platform --help >/dev/null
          elif [[ -e openstack_platform/operator.py || -e openstack_platform/helper/actions-v1.txt ]]; then
            echo "CLI composition and helper action manifest must land together" >&2
            exit 1
          else
            echo "Integrated entrypoints are not present on this feature branch"
          fi

      - name: Run unit and packaging tests
        run: uv run python -m unittest discover -s tests -v

      - name: Check shell syntax
        run: |
          find deploy infra tests -type f \( -name '*.sh' -o -path 'infra/control/bin/*' \) \
            -exec bash -n {} +

      - name: Run ShellCheck
        run: |
          find deploy infra tests -type f \( -name '*.sh' -o -path 'infra/control/bin/*' \) -print0 \
            | xargs -0 shellcheck -e SC1090,SC1091,SC2016

  generated-recipes:
    name: Build, start, and health-check generated Bun and Node recipes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.2"
          enable-cache: true

      - name: Install locked application recipe test environment
        run: uv sync --frozen --no-dev

      - name: Install rootless OCI runner tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes fuse-overlayfs podman slirp4netns uidmap

      - name: Generate, build, start, and health-check both runtime recipes
        run: tests/smoke_generated_recipes.sh

  nix-eval:
    name: Nix evaluation and formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check flake
        run: nix flake check --no-build --print-build-logs

      - name: Check Nix formatting
        run: |
          nix fmt -- .
          git diff --exit-code -- '*.nix'

  package-tests:
    name: Test packaged binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - run: nix build --print-build-logs .#checks.x86_64-linux.package-smoke

  role-vm-tests:
    name: Test ${{ matrix.role }} VM
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        role:
          - admin
          - ingress
          - storage
          - worker
          - builder
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable KVM when available
        run: |
          if [[ -e /dev/kvm ]]; then
            sudo chmod 0666 /dev/kvm
          fi
      - run: nix build --print-build-logs ".#checks.x86_64-linux.vm-${{ matrix.role }}"

  publication-context:
    name: Detect publishable image changes
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.context.outputs.commit_sha }}
      publish: ${{ steps.context.outputs.publish }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Record publication context
        id: context
        env:
          BEFORE_SHA: ${{ github.event.before }}
          COMMIT_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          publish=false
          # Documentation inside an image-input directory does not change any
          # image, so exclude it. Without this a README edit under nix/ rebuilds
          # and republishes all five role images.
          publish_paths=(
            flake.nix flake.lock nix infra openstack_platform deploy
            pyproject.toml uv.lock LICENSE ':(exclude)*.md'
          )
          if [[ $EVENT_NAME == workflow_dispatch && $MANUAL_PUBLISH == true ]]; then
            publish=true
          elif [[ $BEFORE_SHA =~ ^0+$ ]]; then
            if git ls-tree -r --name-only "$COMMIT_SHA" -- "${publish_paths[@]}" | grep -q .; then
              publish=true
            fi
          elif ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            echo "Previous push commit is unavailable; automatic publication is disabled for this run"
          elif ! git diff --quiet "$BEFORE_SHA" "$COMMIT_SHA" -- "${publish_paths[@]}"; then
            publish=true
          fi
          printf 'publish=%s\ncommit_sha=%s\n' "$publish" "$COMMIT_SHA" >> "$GITHUB_OUTPUT"

  build-images:
    name: Build ${{ matrix.role }} image
    needs: publication-context
    if: >-
      always() &&
      inputs.development_publish != true &&
      (needs.publication-context.outputs.publish != 'true' ||
       vars.OPENSTACK_PUBLISH_ENABLED != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        role:
          - admin
          - ingress
          - storage
          - worker
          - builder

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install QEMU smoke-test tools
        run: |
          tests/install_ci_apt_packages.sh genisoimage qemu-system-x86 qemu-utils
          if [[ -e /dev/kvm ]]; then
            sudo chmod 0666 /dev/kvm
          fi

      - name: Build role image
        run: |
          nix build --print-build-logs \
            --out-link "result-${{ matrix.role }}" \
            ".#${{ matrix.role }}-image"

      - name: Locate and boot role image
        run: |
          qcow=$(find -L "result-${{ matrix.role }}" -type f -name '*.qcow2' -print -quit)
          test -n "$qcow"
          tests/smoke_openstack_image.sh "${{ matrix.role }}" "$qcow"

  build-and-publish-images:
    name: Build ${{ matrix.role }} image
    needs:
      - static
      - generated-recipes
      - nix-eval
      - package-tests
      - role-vm-tests
      - publication-context
    if: >-
      needs.publication-context.outputs.publish == 'true' &&
      vars.OPENSTACK_PUBLISH_ENABLED == 'true'
    environment: openstack-images
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        role:
          - admin
          - ingress
          - storage
          - worker
          - builder

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.publication-context.outputs.commit_sha }}

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install publication and smoke-test tools
        run: |
          tests/install_ci_apt_packages.sh \
            genisoimage \
            python3-openstackclient \
            qemu-system-x86 \
            qemu-utils
          if [[ -e /dev/kvm ]]; then
            sudo chmod 0666 /dev/kvm
          fi

      - name: Install private deployment configuration
        env:
          COMMIT_SHA: ${{ needs.publication-context.outputs.commit_sha }}
          OS_PROJECT_ID: ${{ secrets.OS_PROJECT_ID }}
          PLATFORM_CONFIG_JSON: ${{ secrets.PLATFORM_CONFIG_JSON }}
          RELEASE_EVIDENCE_URL: ${{ vars.RELEASE_EVIDENCE_URL }}
          RELEASE_EVIDENCE_SHA256: ${{ vars.RELEASE_EVIDENCE_SHA256 }}
          RELEASE_TRUST_ROOT_PEM: ${{ vars.RELEASE_TRUST_ROOT_PEM }}
        run: |
          set -euo pipefail
          test -n "$OS_PROJECT_ID"
          test -n "$PLATFORM_CONFIG_JSON"
          umask 077
          printf '%s\n' "$PLATFORM_CONFIG_JSON" > config/platform.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from uuid import UUID

          path = Path("config/platform.json")
          document = json.loads(path.read_text())
          commit = os.environ["COMMIT_SHA"]
          if len(commit) != 40 or any(char not in "0123456789abcdef" for char in commit):
              raise SystemExit("invalid publication commit")
          try:
              project_id = str(UUID(os.environ["OS_PROJECT_ID"]))
          except ValueError as error:
              raise SystemExit("invalid publication project ID") from error
          document["projectId"] = project_id
          image_suffix = commit[:8]
          document["images"] = {
              role: f"{name}-{image_suffix}"
              for role, name in document["images"].items()
          }
          path.write_text(json.dumps(document, indent=2) + "\n")
          PY
          # Fail here, in seconds, if the stored inventory has drifted from the
          # schema this commit expects. Without this the first symptom is an
          # opaque Nix evaluation error an hour into the publish matrix.
          python3 infra/lib/platform_config.py validate
          for name in RELEASE_EVIDENCE_URL RELEASE_EVIDENCE_SHA256 RELEASE_TRUST_ROOT_PEM; do
            test -n "${!name}"
          done
          install -d -m 0700 release-evidence-root
          printf '%s\n' "$RELEASE_TRUST_ROOT_PEM" > release-evidence-root/trust-root.pem
          chmod 0600 release-evidence-root/trust-root.pem
          python3 -m openstack_platform.release_manifest bundle-fetch \
            --url "$RELEASE_EVIDENCE_URL" \
            --sha256 "$RELEASE_EVIDENCE_SHA256" \
            --destination release-evidence \
            --commit "$COMMIT_SHA" \
            --trust-root release-evidence-root/trust-root.pem
          project=$(python3 infra/lib/platform_config.py get project)
          printf 'OS_PROJECT_NAME=%s\n' "$project" >> "$GITHUB_ENV"
          printf '%s\n' \
            'PLATFORM_RELEASE_MANIFEST=${{ github.workspace }}/release-evidence/release-manifest.json' \
            'PLATFORM_ARTIFACT_MANIFEST=${{ github.workspace }}/release-evidence/artifacts/role-artifacts.json' \
            'PLATFORM_ARTIFACT_SIGNATURE=${{ github.workspace }}/release-evidence/artifacts/role-artifacts.sig' \
            'PLATFORM_ARTIFACT_TRUST_ROOT=${{ github.workspace }}/release-evidence-root/trust-root.pem' \
            >> "$GITHUB_ENV"

      - name: Build role image
        env:
          PLATFORM_CONFIG: ${{ github.workspace }}/config/platform.json
        run: |
          nix build --impure --print-build-logs \
            --out-link "result-${{ matrix.role }}" \
            ".#${{ matrix.role }}-image"

      - name: Locate role image
        id: artifact
        run: |
          set -euo pipefail
          qcow=$(find -L "result-${{ matrix.role }}" -type f -name '*.qcow2' -print -quit)
          test -n "$qcow"
          sha256sum "$qcow"
          nix_output=$(readlink -f "result-${{ matrix.role }}")
          path_info="$RUNNER_TEMP/${{ matrix.role }}.path-info.json"
          nix path-info --json --recursive "$nix_output" > "$path_info"
          printf 'qcow=%s\nnix_output=%s\npath_info=%s\n' \
            "$qcow" "$nix_output" "$path_info" >> "$GITHUB_OUTPUT"

      - name: Verify signed role artifact
        env:
          COMMIT_SHA: ${{ needs.publication-context.outputs.commit_sha }}
          PLATFORM_CONFIG: ${{ github.workspace }}/config/platform.json
        run: |
          set -euo pipefail
          verification=$(python3 -m openstack_platform.release_manifest verify-role \
            --component-manifest "$PLATFORM_RELEASE_MANIFEST" \
            --manifest "$PLATFORM_ARTIFACT_MANIFEST" \
            --signature "$PLATFORM_ARTIFACT_SIGNATURE" \
            --trust-root "$PLATFORM_ARTIFACT_TRUST_ROOT" \
            --role "${{ matrix.role }}" \
            --qcow2 "${{ steps.artifact.outputs.qcow }}" \
            --path-info "${{ steps.artifact.outputs.path_info }}" \
            --output-store-path "${{ steps.artifact.outputs.nix_output }}" \
            --platform "$PLATFORM_CONFIG" \
            --commit "$COMMIT_SHA")
          while IFS='=' read -r key value; do
            case "$key" in
              artifact_manifest_sha256) name=PLATFORM_ARTIFACT_MANIFEST_SHA256 ;;
              qcow2_sha256) name=PLATFORM_ARTIFACT_QCOW2_SHA256 ;;
              nix_closure_sha256) name=PLATFORM_ARTIFACT_NIX_CLOSURE_SHA256 ;;
              nix_output) name=PLATFORM_ARTIFACT_NIX_OUTPUT ;;
              *) echo "unexpected artifact verification field" >&2; exit 1 ;;
            esac
            printf '%s=%s\n' "$name" "$value" >> "$GITHUB_ENV"
          done <<< "$verification"

      - name: Boot role image with config drive
        run: tests/smoke_openstack_image.sh "${{ matrix.role }}" "${{ steps.artifact.outputs.qcow }}"

      - name: Check configured image
        id: image
        env:
          COMMIT_SHA: ${{ needs.publication-context.outputs.commit_sha }}
          OS_AUTH_TYPE: password
          OS_AUTH_URL: ${{ secrets.OS_AUTH_URL }}
          OS_IDENTITY_API_VERSION: "3"
          OS_INTERFACE: public
          OS_PASSWORD: ${{ secrets.OS_PASSWORD }}
          OS_PROJECT_DOMAIN_NAME: Default
          OS_PROJECT_ID: ${{ secrets.OS_PROJECT_ID }}
          OS_USER_DOMAIN_NAME: Default
          OS_USERNAME: ${{ secrets.OS_USERNAME }}
        run: |
          set -euo pipefail
          test -n "$OS_AUTH_URL"
          test -n "$OS_PASSWORD"
          test -n "$OS_PROJECT_ID"
          test -n "$OS_USERNAME"
          token_project_id=$(openstack token issue -f value -c project_id)
          test "$token_project_id" = "$OS_PROJECT_ID"
          image_name=$(python3 infra/lib/platform_config.py get "images.${{ matrix.role }}")
          existing=$(openstack image list --name "$image_name" -f value -c Name)
          if grep -Fxq "$image_name" <<<"$existing"; then
            namespace=$(python3 infra/lib/platform_config.py get namespace)
            source_property="${namespace//-/_}_source_commit"
            properties=$(openstack image show "$image_name" -f json -c properties)
            existing_commit=$(
              PROPERTIES="$properties" SOURCE_PROPERTY="$source_property" python3 - <<'PY'
          import json
          import os

          properties = json.loads(os.environ["PROPERTIES"]).get("properties", {})
          print(properties.get(os.environ["SOURCE_PROPERTY"], ""))
          PY
            )
            if [[ $existing_commit != "$COMMIT_SHA" ]]; then
              echo "Image-name collision: $image_name does not identify $COMMIT_SHA" >&2
              exit 1
            fi
            echo "Configured image already exists for commit: $image_name"
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          else
            echo "Configured image is new: $image_name"
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Publish role image
        if: steps.image.outputs.publish == 'true'
        env:
          OS_AUTH_TYPE: password
          OS_AUTH_URL: ${{ secrets.OS_AUTH_URL }}
          OS_IDENTITY_API_VERSION: "3"
          OS_INTERFACE: public
          OS_PASSWORD: ${{ secrets.OS_PASSWORD }}
          OS_PROJECT_DOMAIN_NAME: Default
          OS_PROJECT_ID: ${{ secrets.OS_PROJECT_ID }}
          OS_USER_DOMAIN_NAME: Default
          OS_USERNAME: ${{ secrets.OS_USERNAME }}
          PLATFORM_CONFIG: ${{ github.workspace }}/config/platform.json
          SOURCE_COMMIT: ${{ needs.publication-context.outputs.commit_sha }}
        run: |
          set -euo pipefail
          infra/openstack/publish_nixos_image.sh \
            "${{ matrix.role }}" \
            "${{ steps.artifact.outputs.qcow }}" \
            "${{ steps.artifact.outputs.nix_output }}" \
            "${{ steps.artifact.outputs.path_info }}"

      - name: Remove private deployment configuration
        if: always()
        run: rm -f config/platform.json

  development-role-evidence:
    name: Build development ${{ matrix.role }} evidence
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.development_publish == true &&
      github.ref_name != 'main' &&
      vars.OPENSTACK_PUBLISH_ENABLED == 'true'
    environment: openstack-images
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        role:
          - admin
          - ingress
          - storage
          - worker
          - builder
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Require an exact open same-repository PR head
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          pulls=$(gh api "repos/$GITHUB_REPOSITORY/pulls" --method GET \
            -f state=open -f base=main \
            -f "head=$GITHUB_REPOSITORY_OWNER:$HEAD_BRANCH")
          jq -e --arg repository "$GITHUB_REPOSITORY" --arg sha "$HEAD_SHA" '
            length == 1 and
            .[0].head.sha == $sha and
            .[0].head.repo.full_name == $repository and
            .[0].base.ref == "main"
          ' <<<"$pulls" >/dev/null

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable KVM when available
        run: |
          if [[ -e /dev/kvm ]]; then
            sudo chmod 0666 /dev/kvm
          fi

      - name: Install isolated development inventory
        env:
          COMMIT_SHA: ${{ github.sha }}
          OS_PROJECT_ID: ${{ secrets.OS_PROJECT_ID }}
          PLATFORM_CONFIG_JSON: ${{ secrets.DEVELOPMENT_PLATFORM_CONFIG_JSON }}
        run: |
          set -euo pipefail
          test -n "$OS_PROJECT_ID"
          test -n "$PLATFORM_CONFIG_JSON"
          umask 077
          printf '%s\n' "$PLATFORM_CONFIG_JSON" > config/platform.json
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          from uuid import UUID

          path = Path("config/platform.json")
          document = json.loads(path.read_text())
          commit = os.environ["COMMIT_SHA"]
          if re.fullmatch(r"[0-9a-f]{40}", commit) is None:
              raise SystemExit("invalid development publication commit")
          document["projectId"] = str(UUID(os.environ["OS_PROJECT_ID"]))
          document["images"] = {
              role: f"{re.sub(r'-[0-9a-f]{8}$', '', name)}-{commit[:8]}"
              for role, name in document["images"].items()
          }
          path.write_text(json.dumps(document, indent=2) + "\n")
          PY
          python3 infra/lib/platform_config.py validate
          project=$(python3 infra/lib/platform_config.py get project)
          printf 'OS_PROJECT_NAME=%s\n' "$project" >> "$GITHUB_ENV"

      - name: Build role image
        env:
          PLATFORM_CONFIG: ${{ github.workspace }}/config/platform.json
        run: |
          nix build --impure --print-build-logs \
            --out-link "result-${{ matrix.role }}" \
            ".#${{ matrix.role }}-image"

      - name: Record compact role evidence
        env:
          COMMIT_SHA: ${{ github.sha }}
          PLATFORM_CONFIG: ${{ github.workspace }}/config/platform.json
          ROLE: ${{ matrix.role }}
        run: |
          set -euo pipefail
          install -d -m 0700 development-role-input development-role-qcow
          output=$(readlink -f "result-$ROLE")
          qcow=$(find -L "result-$ROLE" -type f -name '*.qcow2' -print -quit)
          test -n "$qcow"
          cp --reflink=auto --sparse=always -- "$qcow" "development-role-qcow/$ROLE.qcow2"
          nix path-info --json --recursive "$output" \
            >"development-role-input/$ROLE.path-info.json"
          QCOW2="$qcow" NIX_OUTPUT="$output" python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from openstack_platform.config import load_platform
          from openstack_platform.openstack import publisher_metadata

          role = os.environ["ROLE"]
          qcow = Path(os.environ["QCOW2"])
          digest = hashlib.sha256()
          with qcow.open("rb") as stream:
              for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                  digest.update(chunk)
          record = {
              "role": role,
              "qcow2Sha256": digest.hexdigest(),
              "qcow2SizeBytes": qcow.stat().st_size,
              "pathInfo": f"{role}.path-info.json",
              "outputStorePath": os.environ["NIX_OUTPUT"],
              "publicationMetadata": dict(
                  publisher_metadata(
                      load_platform(Path(os.environ["PLATFORM_CONFIG"])),
                      role,
                      os.environ["COMMIT_SHA"],
                  )
              ),
          }
          Path(f"development-role-input/{role}.json").write_text(
              json.dumps(record, indent=2, sort_keys=True) + "\n"
          )
          PY

      - name: Upload compact role evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: development-role-input-${{ github.sha }}-${{ matrix.role }}
          path: development-role-input
          if-no-files-found: warn
          retention-days: 1

      - name: Upload exact role QCOW2
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: development-role-qcow-${{ github.sha }}-${{ matrix.role }}
          path: development-role-qcow/${{ matrix.role }}.qcow2
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Remove private deployment configuration
        if: always()
        run: rm -f config/platform.json

  development-evidence:
    name: Aggregate development role evidence
    needs: development-role-evidence
    if: needs.development-role-evidence.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      - name: Download compact role evidence
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: development-role-input-${{ github.sha }}-*
          path: development-recorded-inputs
          merge-multiple: true

      - name: Generate shared unsigned development evidence
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 -m openstack_platform.release_manifest generate \
            --repository "$PWD" --commit "$COMMIT_SHA" \
            --output development-release-evidence \
            --unsigned-development
          python3 -m openstack_platform.release_manifest verify \
            --repository "$PWD" --commit "$COMMIT_SHA" \
            --manifest development-release-evidence/release-manifest.json \
            --allow-unsigned-development
          python3 - <<'PY'
          import json
          from pathlib import Path

          roles = ("admin", "ingress", "storage", "worker", "builder")
          root = Path("development-recorded-inputs")
          expected = {
              *(f"{role}.json" for role in roles),
              *(f"{role}.path-info.json" for role in roles),
          }
          observed = {path.name for path in root.iterdir() if path.is_file()}
          if observed != expected:
              raise SystemExit("recorded role evidence set is incomplete or ambiguous")
          inputs = {}
          required = {
              "role",
              "qcow2Sha256",
              "qcow2SizeBytes",
              "pathInfo",
              "outputStorePath",
              "publicationMetadata",
          }
          for role in roles:
              record = json.loads((root / f"{role}.json").read_text())
              if set(record) != required or record["role"] != role:
                  raise SystemExit(f"recorded role evidence is malformed: {role}")
              if record.pop("pathInfo") != f"{role}.path-info.json":
                  raise SystemExit(f"recorded path-info identity differs: {role}")
              record.pop("role")
              record["pathInfo"] = str((root / f"{role}.path-info.json").resolve())
              inputs[role] = record
          path = Path("development-recorded-inputs/artifact-inputs.json")
          path.write_text(json.dumps(inputs, indent=2, sort_keys=True) + "\n")
          PY
          python3 -m openstack_platform.release_manifest artifact-generate \
            --component-manifest development-release-evidence/release-manifest.json \
            --inputs development-recorded-inputs/artifact-inputs.json \
            --output development-release-evidence/artifacts \
            --unsigned-development
          python3 -m openstack_platform.release_manifest artifact-verify \
            --component-manifest development-release-evidence/release-manifest.json \
            --manifest development-release-evidence/artifacts/role-artifacts.json \
            --allow-unsigned-development

      - name: Upload shared development evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: development-role-evidence-${{ github.sha }}
          path: development-release-evidence
          if-no-files-found: error
          retention-days: 7

  development-publish:
    name: Publish development ${{ matrix.role }} image
    needs: development-evidence
    if: needs.development-evidence.result == 'success'
    environment: openstack-images
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        role:
          - admin
          - ingress
          - storage
          - worker
          - builder
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      - name: Install publication and smoke-test tools
        run: |
          tests/install_ci_apt_packages.sh \
            genisoimage \
            python3-openstackclient \
            qemu-system-x86 \
            qemu-utils
          if [[ -e /dev/kvm ]]; then
            sudo chmod 0666 /dev/kvm
          fi

      - name: Install isolated development inventory
        env:
          COMMIT_SHA: ${{ github.sha }}
          OS_PROJECT_ID: ${{ secrets.OS_PROJECT_ID }}
          PLATFORM_CONFIG_JSON: ${{ secrets.DEVELOPMENT_PLATFORM_CONFIG_JSON }}
        run: |
          set -euo pipefail
          test -n "$OS_PROJECT_ID"
          test -n "$PLATFORM_CONFIG_JSON"
          umask 077
          printf '%s\n' "$PLATFORM_CONFIG_JSON" > config/platform.json
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          from uuid import UUID

          path = Path("config/platform.json")
          document = json.loads(path.read_text())
          commit = os.environ["COMMIT_SHA"]
          if re.fullmatch(r"[0-9a-f]{40}", commit) is None:
              raise SystemExit("invalid development publication commit")
          document["projectId"] = str(UUID(os.environ["OS_PROJECT_ID"]))
          document["images"] = {
              role: f"{re.sub(r'-[0-9a-f]{8}$', '', name)}-{commit[:8]}"
              for role, name in document["images"].items()
          }
          path.write_text(json.dumps(document, indent=2) + "\n")
          PY
          python3 infra/lib/platform_config.py validate
          project=$(python3 infra/lib/platform_config.py get project)
          printf 'OS_PROJECT_NAME=%s\n' "$project" >> "$GITHUB_ENV"

      - name: Download shared development evidence
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: development-role-evidence-${{ github.sha }}
          path: development-release-evidence

      - name: Download compact role evidence
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: development-role-input-${{ github.sha }}-${{ matrix.role }}
          path: development-role-input

      - name: Download exact role QCOW2
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: development-role-qcow-${{ github.sha }}-${{ matrix.role }}
          path: development-role-qcow

      - name: Verify, boot, and publish role image
        env:
          COMMIT_SHA: ${{ github.sha }}
          OS_AUTH_TYPE: password
          OS_AUTH_URL: ${{ secrets.OS_AUTH_URL }}
          OS_IDENTITY_API_VERSION: "3"
          OS_INTERFACE: public
          OS_PASSWORD: ${{ secrets.OS_PASSWORD }}
          OS_PROJECT_DOMAIN_NAME: Default
          OS_PROJECT_ID: ${{ secrets.OS_PROJECT_ID }}
          OS_USER_DOMAIN_NAME: Default
          OS_USERNAME: ${{ secrets.OS_USERNAME }}
          PLATFORM_ALLOW_UNSIGNED_DEVELOPMENT: I_UNDERSTAND_THIS_IS_NOT_PRODUCTION
          PLATFORM_CONFIG: ${{ github.workspace }}/config/platform.json
          PLATFORM_RELEASE_MANIFEST: ${{ github.workspace }}/development-release-evidence/release-manifest.json
          PLATFORM_ARTIFACT_MANIFEST: ${{ github.workspace }}/development-release-evidence/artifacts/role-artifacts.json
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          for name in OS_AUTH_URL OS_PASSWORD OS_PROJECT_ID OS_USERNAME; do
            test -n "${!name}"
          done
          role=${{ matrix.role }}
          record="$PWD/development-role-input/$role.json"
          qcow="$PWD/development-role-qcow/$role.qcow2"
          path_info="$PWD/development-role-input/$role.path-info.json"
          test -f "$record" && test -f "$qcow" && test -f "$path_info"
          output=$(RECORD="$record" ROLE="$role" python3 - <<'PY'
          import json
          import os
          import re

          record = json.load(open(os.environ["RECORD"], encoding="utf-8"))
          if (
              set(record)
              != {
                  "role",
                  "qcow2Sha256",
                  "qcow2SizeBytes",
                  "pathInfo",
                  "outputStorePath",
                  "publicationMetadata",
              }
              or record["role"] != os.environ["ROLE"]
              or record["pathInfo"] != f"{os.environ['ROLE']}.path-info.json"
              or re.fullmatch(r"/nix/store/[a-z0-9]{32}-[^/]+", record["outputStorePath"])
              is None
          ):
              raise SystemExit("downloaded role evidence is malformed")
          print(record["outputStorePath"])
          PY
          )
          verification=$(python3 -m openstack_platform.release_manifest verify-role \
            --component-manifest "$PLATFORM_RELEASE_MANIFEST" \
            --manifest "$PLATFORM_ARTIFACT_MANIFEST" \
            --allow-unsigned-development \
            --role "$role" --qcow2 "$qcow" --path-info "$path_info" \
            --output-store-path "$output" --platform "$PLATFORM_CONFIG" \
            --commit "$COMMIT_SHA")
          while IFS='=' read -r key value; do
            case "$key" in
              artifact_manifest_sha256) export PLATFORM_ARTIFACT_MANIFEST_SHA256=$value ;;
              qcow2_sha256) export PLATFORM_ARTIFACT_QCOW2_SHA256=$value ;;
              nix_closure_sha256) export PLATFORM_ARTIFACT_NIX_CLOSURE_SHA256=$value ;;
              nix_output) export PLATFORM_ARTIFACT_NIX_OUTPUT=$value ;;
              *) echo "unexpected artifact verification field" >&2; exit 1 ;;
            esac
          done <<< "$verification"
          tests/smoke_openstack_image.sh "$role" "$qcow"
          infra/openstack/publish_nixos_image.sh "$role" "$qcow" "$output" "$path_info"

      - name: Remove private deployment configuration
        if: always()
        run: rm -f config/platform.json

  live-acceptance:
    name: Disposable live acceptance
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.live_acceptance == true &&
      vars.LIVE_ACCEPTANCE_ENABLED == 'true'
    environment: live-acceptance
    runs-on: [self-hosted, live-acceptance]
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.2"
          enable-cache: true

      - name: Install locked acceptance environment
        run: uv sync --frozen

      - name: Install protected run configuration
        env:
          LIVE_ACCEPTANCE_DRIVER_CONFIG_BASE64: ${{ secrets.LIVE_ACCEPTANCE_DRIVER_CONFIG_BASE64 }}
          LIVE_ACCEPTANCE_EVIDENCE_HMAC_KEY_BASE64: ${{ secrets.LIVE_ACCEPTANCE_EVIDENCE_HMAC_KEY_BASE64 }}
          LIVE_ACCEPTANCE_PROJECT_ID: ${{ secrets.LIVE_ACCEPTANCE_PROJECT_ID }}
        run: |
          set -euo pipefail
          test -n "$LIVE_ACCEPTANCE_DRIVER_CONFIG_BASE64"
          test -n "$LIVE_ACCEPTANCE_EVIDENCE_HMAC_KEY_BASE64"
          test -n "$LIVE_ACCEPTANCE_PROJECT_ID"
          root="/srv/openstack-platform-acceptance/runs/$GITHUB_RUN_ID"
          umask 077
          install -d -m 0700 "$root" "$root/state"
          base64 --decode <<<"$LIVE_ACCEPTANCE_DRIVER_CONFIG_BASE64" > "$root/driver.json"
          base64 --decode <<<"$LIVE_ACCEPTANCE_EVIDENCE_HMAC_KEY_BASE64" > "$root/signing.key"
          chmod 0600 "$root/driver.json" "$root/signing.key"
          python3 - "$root/driver.json" "$root/context" "$LIVE_ACCEPTANCE_PROJECT_ID" <<'PY'
          import json, shlex, sys
          config = json.load(open(sys.argv[1], encoding="utf-8"))
          if config["projectId"] != sys.argv[3]:
              raise SystemExit("driver and protected project IDs differ")
          with open(sys.argv[2], "w", encoding="utf-8") as output:
              for name, key in (("LIVE_ACCEPTANCE_DEPLOYMENT_ID", "deploymentId"), ("LIVE_ACCEPTANCE_NAMESPACE", "namespace")):
                  output.write(f"{name}={shlex.quote(config[key])}\n")
          PY
          chmod 0600 "$root/context"
          printf 'LIVE_ACCEPTANCE_ROOT=%s\nLIVE_ACCEPTANCE_PROJECT_ID=%s\nLIVE_ACCEPTANCE_DRIVER_CONFIG=%s\n' \
            "$root" "$LIVE_ACCEPTANCE_PROJECT_ID" "$root/driver.json" >> "$GITHUB_ENV"

      - name: Produce the non-mutating plan
        env:
          LIVE_ACCEPTANCE_DRIVER: ${{ github.workspace }}/.venv/bin/openstack-platform-acceptance-driver
        run: |
          set -euo pipefail
          source "$LIVE_ACCEPTANCE_ROOT/context"
          if [[ ! -f $LIVE_ACCEPTANCE_ROOT/plan.json ]]; then
            uv run openstack-platform-acceptance plan \
              --deployment-id "$LIVE_ACCEPTANCE_DEPLOYMENT_ID" \
              --project-id "$LIVE_ACCEPTANCE_PROJECT_ID" \
              --namespace "$LIVE_ACCEPTANCE_NAMESPACE" \
              --driver "$LIVE_ACCEPTANCE_DRIVER" \
              --output "$LIVE_ACCEPTANCE_ROOT/plan.json"
          fi
          python3 -m json.tool "$LIVE_ACCEPTANCE_ROOT/plan.json"
          sha256sum "$LIVE_ACCEPTANCE_ROOT/plan.json"
          transcript=$(python3 -c 'import json,os; print(json.load(open(os.environ["LIVE_ACCEPTANCE_DRIVER_CONFIG"]))["transcript"])')
          install -m 0600 -- "$transcript" "$LIVE_ACCEPTANCE_ROOT/plan-transcript.json"

      - name: Apply or resume the reviewed plan
        env:
          LIVE_ACCEPTANCE_DRIVER: ${{ github.workspace }}/.venv/bin/openstack-platform-acceptance-driver
          LIVE_ACCEPTANCE_APPLY: "1"
        run: |
          set -euo pipefail
          source "$LIVE_ACCEPTANCE_ROOT/context"
          uv run openstack-platform-acceptance run \
            --plan "$LIVE_ACCEPTANCE_ROOT/plan.json" \
            --driver "$LIVE_ACCEPTANCE_DRIVER" \
            --state-directory "$LIVE_ACCEPTANCE_ROOT/state" \
            --signing-key "$LIVE_ACCEPTANCE_ROOT/signing.key" \
            --apply \
            --confirm "LIVE-ACCEPTANCE:$LIVE_ACCEPTANCE_DEPLOYMENT_ID"
          uv run openstack-platform-acceptance verify \
            --evidence-directory "$LIVE_ACCEPTANCE_ROOT/state" \
            --signing-key "$LIVE_ACCEPTANCE_ROOT/signing.key"

      - name: Remove local protected inputs
        if: always()
        run: rm -f "${LIVE_ACCEPTANCE_ROOT:-/nonexistent}/signing.key" "${LIVE_ACCEPTANCE_ROOT:-/nonexistent}/driver.json"

      - name: Upload sanitized acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: live-acceptance-${{ github.run_id }}
          path: |
            /srv/openstack-platform-acceptance/runs/${{ github.run_id }}/plan.json
            /srv/openstack-platform-acceptance/runs/${{ github.run_id }}/plan-transcript.json
            /srv/openstack-platform-acceptance/runs/${{ github.run_id }}/state/evidence.json
            /srv/openstack-platform-acceptance/runs/${{ github.run_id }}/state/evidence.json.sha256
            /srv/openstack-platform-acceptance/runs/${{ github.run_id }}/state/evidence.json.hmac-sha256
          if-no-files-found: warn
          retention-days: 30
