#cloud-config
hostname: __ADMIN_HOST__
ssh_pwauth: false
disable_root: true
users:
  - default
  - name: __OPERATOR_USER__
    lock_passwd: true
    shell: /run/current-system/sw/bin/bash
    ssh_authorized_keys:
      - __OPERATOR_PUBLIC_KEY__
bootcmd:
  - |
    set -eu
    initialized=0
    for specification in '/dev/vdb:__ADMIN_VOLUME_LABEL__' '/dev/vdc:__BACKUP_VOLUME_LABEL__'; do
      device=${specification%%:*}
      label=${specification#*:}
      for attempt in $(seq 1 60); do
        [ -b "$device" ] && break
        sleep 1
      done
      [ -b "$device" ] || { echo "missing retained volume device: $device" >&2; exit 1; }
      if blkid -p -s TYPE -o value "$device" >/dev/null 2>&1; then
        observed=$(blkid -p -s LABEL -o value "$device" 2>/dev/null || true)
        [ "$observed" = "$label" ] || { echo "unexpected retained volume label on $device" >&2; exit 1; }
      else
        mkfs.xfs -f -L "$label" "$device"
        initialized=1
      fi
    done
    if [ "$initialized" = 1 ]; then
      echo "fresh retained volumes initialized; rebooting once"
      sync
      systemctl reboot
    fi
write_files:
  - path: /etc/__PLATFORM_NAMESPACE__/.provisioned
    permissions: "0600"
    owner: root:root
    content: |
      config-drive-v1
  - path: /etc/__PLATFORM_NAMESPACE__/secrets/nomad-gossip-key
    owner: root:root
    permissions: "0600"
    content: __NOMAD_GOSSIP_KEY__
  - path: /etc/__PLATFORM_NAMESPACE__/pki/internal-ca.pem
    owner: root:root
    permissions: "0644"
    encoding: b64
    content: __INTERNAL_CA_B64__
  - path: /etc/__PLATFORM_NAMESPACE__/pki/nomad-cli-ca.pem
    owner: __OPERATOR_USER__:__OPERATOR_USER__
    permissions: "0644"
    encoding: b64
    content: __INTERNAL_CA_B64__
  - path: /etc/__PLATFORM_NAMESPACE__/pki/nomad-server.pem
    owner: root:nomad
    permissions: "0640"
    encoding: b64
    content: __NOMAD_SERVER_CERT_B64__
  - path: /etc/__PLATFORM_NAMESPACE__/pki/nomad-server-key.pem
    owner: root:nomad
    permissions: "0640"
    encoding: b64
    content: __NOMAD_SERVER_KEY_B64__
  - path: /etc/__PLATFORM_NAMESPACE__/pki/nomad-cli.pem
    owner: __OPERATOR_USER__:__OPERATOR_USER__
    permissions: "0644"
    encoding: b64
    content: __NOMAD_CLI_CERT_B64__
  - path: /etc/__PLATFORM_NAMESPACE__/pki/nomad-cli-key.pem
    owner: __OPERATOR_USER__:__OPERATOR_USER__
    permissions: "0600"
    encoding: b64
    content: __NOMAD_CLI_KEY_B64__
  - path: /etc/__PLATFORM_NAMESPACE__/attached-volumes.env
    owner: root:root
    permissions: "0644"
    content: |
      ADMIN_VOLUME_ID=__ADMIN_VOLUME_ID__
      BACKUP_VOLUME_ID=__BACKUP_VOLUME_ID__
      ADMIN_IP=__ADMIN_IP__
      REGION=__REGION__
      DATACENTER=__DATACENTER__
final_message: "__PLATFORM_NAMESPACE__ NixOS admin provisioning data installed"
